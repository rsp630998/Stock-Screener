name: Daily Stock Screener

on:
  schedule:
    # Runs at 22:00 UTC (5:00 PM EST) Monday through Friday
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime via a button

permissions:
  contents: write

jobs:
  run-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Screener Engine
        run: python screener.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add top100_history.csv top100_list.csv
          git commit -m "Auto-update momentum stock data" || exit 0
          git push
